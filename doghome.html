<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog Home - PBR Lighting</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 10px 12px;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Dog Home (PBR)</b><br />
    ปรับตำแหน่งและความสว่างของไฟจากเมนูด้านขวา
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/dat.gui.min.js"></script>

  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd3ed);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(5, 3.5, 7);

    // หมุนดูบ้านหมาด้วยเมาส์
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.8, 0);
    controls.enableDamping = true;

    // แสงหลัก: ค่าทั้ง 4 ตัวนี้ปรับได้จาก GUI
    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(4, 6, 4);
    light.castShadow = true;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.camera.left = -8;
    light.shadow.camera.right = 8;
    light.shadow.camera.top = 8;
    light.shadow.camera.bottom = -8;
    scene.add(light);
    scene.add(light.target);
    light.target.position.set(0, 0, 0);

    // แสงเติม เพื่อให้ด้านที่เป็นเงาไม่มืดสนิท
    scene.add(new THREE.HemisphereLight(0xbde2ff, 0x4b3728, 0.45));

    // พื้นแบบ PBR สำหรับรับเงา
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x587744,
      metalness: 0.0,
      roughness: 0.9
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Environment map เพื่อให้วัสดุ PBR รับแสงจากสภาพแวดล้อม
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    new THREE.EXRLoader().load(
      'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr',
      (texture) => {
        scene.environment = pmremGenerator.fromEquirectangular(texture).texture;
        texture.dispose();
        pmremGenerator.dispose();
      },
      undefined,
      () => console.log('ไม่สามารถโหลด environment map ได้')
    );

    // โหลดโมเดลบ้านหมา และกำหนดให้ mesh ใช้คุณสมบัติ PBR แบบคงที่
    const loader = new THREE.GLTFLoader();
    loader.load(
      'https://phongsakonn-nut.github.io/13/%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%AB%E0%B8%A1%E0%B8%B2final.glb',
      (gltf) => {
        const dogHome = gltf.scene;

        dogHome.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;

          // MeshStandardMaterial คือ PBR material ของ Three.js
          if (child.material && child.material.isMeshStandardMaterial) {
            child.material.metalness = 0.05;
            child.material.roughness = 0.75;
          }
        });

        scene.add(dogHome);

        // วางโมเดลไว้กลางพื้น
        const box = new THREE.Box3().setFromObject(dogHome);
        const center = box.getCenter(new THREE.Vector3());
        dogHome.position.set(-center.x, -box.min.y, -center.z);
      },
      undefined,
      (error) => console.error('โหลดโมเดลไม่สำเร็จ', error)
    );

    // มีแค่การปรับตำแหน่งไฟและความสว่างตามที่ต้องการ
    const settings = {
      positionX: light.position.x,
      positionY: light.position.y,
      positionZ: light.position.z,
      brightness: light.intensity
    };

    function updateLight() {
      light.position.set(settings.positionX, settings.positionY, settings.positionZ);
      light.intensity = settings.brightness;
    }

    const gui = new dat.GUI();
    gui.add(settings, 'positionX', -10, 10, 0.1).name('ตำแหน่ง X').onChange(updateLight);
    gui.add(settings, 'positionY', 1, 12, 0.1).name('ตำแหน่ง Y').onChange(updateLight);
    gui.add(settings, 'positionZ', -10, 10, 0.1).name('ตำแหน่ง Z').onChange(updateLight);
    gui.add(settings, 'brightness', 0, 5, 0.1).name('ความสว่าง').onChange(updateLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
