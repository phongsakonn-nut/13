<!DOCTYPE html>
<html>

<head>
    <title>Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
     
        // ขยับกล้องให้เห็นโมเดลทั้งหมด
        camera.position.set(0, 8, 25);
        camera.lookAt(0, 3, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let modelRoot = null;
        let cameraTransition = null;

        controls.addEventListener('start', () => {
            cameraTransition = null;
        });

        function getModelHit(event) {
            if (!modelRoot) return null;
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            return raycaster.intersectObject(modelRoot, true)[0] || null;
        }

        renderer.domElement.addEventListener('pointermove', (event) => {
            renderer.domElement.style.cursor = getModelHit(event) ? 'pointer' : 'grab';
        });

        renderer.domElement.addEventListener('click', (event) => {
            const hit = getModelHit(event);
            if (!hit) return;

            const target = hit.point.clone();
            const normal = hit.face.normal.clone().applyMatrix3(
                new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)
            ).normalize();
            if (normal.dot(camera.position.clone().sub(target)) < 0) normal.negate();

            const bounds = new THREE.Box3().setFromObject(hit.object);
            const size = bounds.getSize(new THREE.Vector3());
            const distance = Math.max(2.5, size.length() * 1.4);
            cameraTransition = {
                startPosition: camera.position.clone(),
                startTarget: controls.target.clone(),
                endPosition: target.clone().addScaledVector(normal, distance),
                endTarget: target,
                elapsed: 0,
                duration: 0.8
            };
        });

       //const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        //scene.add(ambientLight);
        const PointLight = new THREE.PointLight(0xffffff, 1.1);
        PointLight.position.set(-1, 2.8, 0);
        scene.add(PointLight);

        const flameUniforms = {
            uTime: { value: 0 }
        };
        const flameMaterial = new THREE.ShaderMaterial({
            uniforms: flameUniforms,
            vertexShader: `
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float height = uv.y;
                    pos.x += sin(uTime * 3.0 + height * 5.0) * 0.08 * height;
                    pos.y += sin(uTime * 2.0) * 0.06;
                    pos.y += sin(uTime * 4.0 + height * 7.0) * 0.035 * height;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    float y = vUv.y;
                    float x = (vUv.x - 0.5) * 2.0;
                    float center = sin(uTime * 3.0 + y * 5.0) * 0.10 * y;
                    float width = 0.68 * pow(max(0.0, 1.0 - y), 0.72)
                                * (0.78 + 0.22 * sin(y * 3.14159));
                    float edge = abs(x - center) / max(width, 0.001);
                    float flicker = 0.92 + 0.08 * sin(uTime * 8.0 + y * 18.0 + x * 5.0);
                    float flame = 1.0 - smoothstep(0.82, 1.0, edge + (1.0 - flicker) * 0.3);

                    if (flame <= 0.01) discard;

                    float core = 1.0 - smoothstep(0.0, 0.72, edge);
                    vec3 orange = vec3(1.0, 0.20, 0.015);
                    vec3 gold = vec3(1.0, 0.58, 0.04);
                    vec3 hotCore = vec3(1.0, 0.90, 0.32);
                    vec3 color = mix(orange, gold, smoothstep(0.08, 0.78, y));
                    color = mix(color, hotCore, core * (1.0 - smoothstep(0.48, 0.95, y)));
                    float alpha = flame * (0.88 + 0.12 * (1.0 - y));

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const flame = new THREE.Mesh(
            new THREE.PlaneBufferGeometry(1.1, 1.6, 24, 24),
            flameMaterial
        );
        flame.position.set(-12, 4.8, 4.4);
        scene.add(flame);

        const flame2 = new THREE.Mesh(flame.geometry, flameMaterial);
        flame2.position.set(-13.8, 3.1, 3.5);
        scene.add(flame2);

        //const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
        //directionalLight.position.set(10, 15, 10);
        //directionalLight.castShadow = true;
        //scene.add(directionalLight);


        const clock = new THREE.Clock();
        let mixer;

        const loader = new THREE.GLTFLoader();
        loader.load('https://phongsakonn-nut.github.io/13/Portf5.glb',
            (gltf) => {
                const model = gltf.scene;
                modelRoot = model;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                model.position.set(0, 0, 0);
                model.scale.set(1, 1, 1);
                scene.add(model);

                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        console.log("Playing:", clip.name);
                        mixer .clipAction(clip) .play();

                    });
                }

            },

            undefined,
            (error) => {console.error(error);}
        );
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            flameUniforms.uTime.value = clock.elapsedTime;
            if (cameraTransition) {
                cameraTransition.elapsed += delta;
                const progress = Math.min(cameraTransition.elapsed / cameraTransition.duration, 1);
                const easedProgress = progress * progress * (3 - 2 * progress);
                camera.position.lerpVectors(
                    cameraTransition.startPosition,
                    cameraTransition.endPosition,
                    easedProgress
                );
                controls.target.lerpVectors(
                    cameraTransition.startTarget,
                    cameraTransition.endTarget,
                    easedProgress
                );
                if (progress === 1) cameraTransition = null;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
